- name: MALDIBANK
  meta: INESC-ID / IST · Research Fellow · Jan 2026 – present
  text: European Commission funded project combining MALDI-TOF mass spectrometry of microbes with machine learning, aimed at microbial identification and antibiotic resistance monitoring. I work on the bioinformatics side as a research fellow.

- name: GLIM-BioData
  meta: BioData.pt · Researcher · Sep 2024 – Dec 2025
  text: Gateway for Living Data Management (RI/00138/2024), a data management centre implementation grant from the Foundation for Science and Technology (€220k). The centre is meant to cement BioData.pt as a primary provider of national expertise in the management and valorisation of Portugal's life and health scientific data.
  url: https://recuperarportugal.gov.pt/prr-resiliencia/capitalizacao-e-inovacao-empresarial/re-c05-i08-ciencia-mais-digital/
  link: Funding programme page

- name: FEGA Portugal
  meta: BioData.pt / ELIXIR Portugal · Collaborator · Mar – Dec 2025
  text: Portuguese node of the Federated European Genome-phenome Archive. I worked as data steward for sensitive data, helpdesk officer and SOP writer, and co-authored the FEGA metadata technical report (EGA v2 model).
  url: https://doi.org/10.5281/zenodo.19388370
  link: Technical report (Zenodo)

- name: PHENET soil ontologies
  meta: ITQB NOVA · Research Fellow · Jul 2024 – Mar 2025
  text: Design and curation of soil ontologies to improve the semantic integration of environmental datasets.

- name: Comparative demography of endangered species
  meta: IGC / FCUL · MSc thesis student · Nov 2022 – Nov 2024
  text: Demographic history and population structure of mouse lemurs (Microcebus) inferred from genomic data, using PSMC and the SNIF structured non-stationary inference framework.
  url: https://hdl.handle.net/10400.5/96800
  link: Thesis (repository)

- name: DARTpaths
  meta: KU Leuven · Erasmus+ intern · Feb – Jul 2021
  text: Platform for investigating the molecular mechanisms of compounds and finding conserved orthologs between model organisms, part of a project on in silico strategies to advance the 3Rs in toxicity testing. During my internship I added Drosophila melanogaster through the phenotype enrichment tool, automated data file availability, and built a method to extract and summarise orthologous genes from Notung files.
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9825785
  link: DARTpaths paper (PubMed Central)
  url2: https://www.academia.edu/download/70012930/Relat_rio_de_Est_gio_ERASMUS_KULeuven_e_IPS_com_correcoes.pdf
  link2: My internship report (PDF)
