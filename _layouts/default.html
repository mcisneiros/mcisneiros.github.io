<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}{% if page.title %} · {{ page.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description | strip_newlines }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description | strip_newlines }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="theme-color" content="#0f766e">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧬%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"Person","name":"Miguel Cisneiros","url":"{{ site.url }}","jobTitle":"Research Fellow","affiliation":{"@type":"Organization","name":"INESC-ID / Instituto Superior Técnico"},"sameAs":["https://github.com/mcisneiros","https://www.linkedin.com/in/miguel-cisneiros/","https://orcid.org/0000-0002-6681-8564"]}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="wrap">
    {{ content }}
    <footer>
      <p>© {{ 'now' | date: '%Y' }} Miguel Cisneiros · Lisbon, Portugal</p>
    </footer>
  </div>
</body>
</html>
