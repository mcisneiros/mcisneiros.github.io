<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <title>Page not found · Miguel Cisneiros</title>
        <script>
            (function () {
                var t = null;
                try { t = localStorage.getItem('theme'); } catch (e) {}
                if (t !== 'light' && t !== 'dark') { t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
                document.documentElement.setAttribute('data-theme', t);
            })();
        </script>
        <link href="{{ '/assets/vendor/bootstrap.min.css' | relative_url }}?v={{ site.time | date: '%s' }}" rel="stylesheet" />
        <link href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}" rel="stylesheet" />
    </head>
    <body>
        <main class="container text-center d-flex flex-column justify-content-center align-items-center" style="min-height:100vh">
            <h1 class="big">404</h1>
            <p class="lead">This page does not exist.</p>
            <p><a href="{{ '/' | relative_url }}">Back to the home page</a></p>
        </main>
    </body>
</html>
